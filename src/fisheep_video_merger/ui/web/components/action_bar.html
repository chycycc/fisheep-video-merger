<div class="mt-4 flex justify-end">
    <button :id="localTool + '-start-btn'" 
            class="px-5 py-2.5 rounded-lg text-sm font-medium text-white bg-primary-500 hover:bg-primary-600 hover:-translate-y-[1px] active:translate-y-0 shadow-[0_4px_12px_rgba(59,130,246,0.3)] hover:shadow-[0_6px_16px_rgba(59,130,246,0.4)] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-[0_4px_12px_rgba(59,130,246,0.3)]" 
            :disabled="$store.app.getTasksForTool(localTool).length === 0" 
            x-text="'🚀 开始' + actionName" 
            @click="window.startToolTask(localTool)">
    </button>
</div>
